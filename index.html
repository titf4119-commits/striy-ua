
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>СТРІЙ UA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1b16;color:#eef8f2;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
header{background:#1c392e;padding:30px 18px}
h1{margin:0;font-size:32px}
header p{color:#c0d5c9}
main{max-width:760px;margin:auto;padding:14px}
section{background:#172c24;border:1px solid #3b5d4d;border-radius:17px;padding:17px;margin:12px 0}
h2{font-size:21px;margin:0 0 16px}
label{display:block;margin:12px 0 6px;color:#d0e4d7}
input,select{width:100%;font-size:16px;padding:13px;border:1px solid #547666;border-radius:11px;background:#263f34;color:white}
button{border:0;border-radius:11px;padding:12px;font-size:15px;font-weight:650;cursor:pointer}
button:disabled{opacity:.4}
.primary{background:#79caa6;color:#09251b;width:100%;margin-top:13px}
.secondary{background:#345347;color:white}
.danger{background:#6a3737;color:white}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1}
.person{background:#243c32;border-radius:12px;padding:12px;margin:9px 0}
.personName{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.muted{color:#b4cfc0;font-size:13px;margin-top:5px}
.personButtons{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.personButtons button{flex:1;min-width:45px}
.present{background:#78caa5;color:#09251b}
.absent{background:#704343;color:white}
.roleSelect{margin-top:10px}
.count{color:#9de0bb;margin:12px 0}
.line{background:#29493b;border-radius:10px;padding:12px;margin:10px 0}
.notice{color:#ffdc9b;font-size:13px;line-height:1.5}
#status{color:#a9e9c6}
.attendanceGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.statCard{background:#243c32;border-radius:17px;padding:20px 10px;text-align:center}
.statNumber{color:#9de0bb;font-size:42px;font-weight:800}
.statLabel{color:#b4cfc0;font-size:15px}
.absentList{background:#243c32;border-radius:15px;padding:17px;margin-top:14px}
.absentTitle{color:#ffaaa0;font-size:17px;font-weight:700}
.absentName{padding:12px 0;border-top:1px solid #395e4c;font-size:17px}
.groupCard{background:#29493b;border-radius:14px;padding:14px;margin:12px 0}
.groupTitle{font-size:19px;font-weight:750;margin-bottom:10px}
.groupLeader{color:#a9e9c6;font-size:14px;margin-bottom:10px}
.groupPerson{background:#395e4c;padding:12px;border-radius:9px;margin:6px 0;overflow-wrap:anywhere}
.groupCount{color:#b4cfc0;font-size:13px;margin-bottom:10px}
@media(max-width:390px){
 .attendanceGrid{gap:8px}
}
</style>
</head>
<body>
<header>
<h1>🇺🇦 СТРІЙ UA</h1>
<p>Список, присутність, ролі та відображення</p>
</header>
<main>

<section>
<h2>➕ Додати людину</h2>
<label for="name">Прізвище або ім'я</label>
<input id="name" placeholder="Наприклад, Остафійчук">
<label for="role">Спеціальна роль</label>
<select id="role"></select>
<button class="primary" id="add">Додати до списку</button>
</section>

<section>
<h2>☑️ Список ліцеїстів</h2>
<div class="actions">
<button class="secondary" id="allYes">✓ Всі є</button>
<button class="secondary" id="allNo">✕ Всі відсутні</button>
</div>
<p class="count" id="count"></p>
<input id="search" placeholder="🔎 Пошук за прізвищем">
<div id="people"></div>
</section>

<section>
<h2>📊 Присутність</h2>
<div class="attendanceGrid">
<div class="statCard">
<div class="statNumber" id="presentCount">0</div>
<div class="statLabel">Присутні</div>
</div>
<div class="statCard">
<div class="statNumber" id="absentCount">0</div>
<div class="statLabel">Відсутні</div>
</div>
</div>
<div class="absentList">
<div class="absentTitle">Відсутні:</div>
<div id="absentNames"></div>
</div>
</section>

<section>
<h2>📐 Налаштування відображення</h2>
<label for="cols">Кількість відділень</label>
<select id="cols">
<option value="4">4 відділення</option>
<option value="3">3 відділення</option>
</select>
<button class="primary" id="build">Сформувати список</button>
</section>

<section>
<h2>⭐ Окремі ролі</h2>
<div id="separateRoles"></div>
</section>

<section>
<h2>🟩 Список за відділеннями</h2>
<p id="status">Додай людей і натисни «Сформувати список».</p>
<div id="formation"></div>
</section>
</main>

<script>
"use strict";

const roles=[
"Звичайний",
"Командир взводу",
"Старшина",
"Командир 1 відділення",
"Командир 2 відділення",
"Командир 3 відділення",
"Командир 4 відділення",
"Завжди перший",
"Завжди останній"
];

const $=id=>document.getElementById(id);
const storageKey="striy_ua_people_v3";
let people=[];

function makeId(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function load(){
 try{
  const saved=JSON.parse(localStorage.getItem(storageKey)||"[]");
  if(Array.isArray(saved)){
   people=saved.filter(p=>p&&typeof p.name==="string").map(p=>({
    id:p.id||makeId(),
    name:p.name,
    role:roles.includes(p.role)?p.role:roles[0],
    present:p.present!==false
   }));
  }
 }catch(e){people=[];}
}

function save(){
 try{
  localStorage.setItem(storageKey,JSON.stringify(people));
 }catch(e){
  alert("Не вдалося зберегти список у браузері.");
 }
}

function element(tag,cls,txt){
 const el=document.createElement(tag);
 if(cls)el.className=cls;
 if(txt!==undefined)el.textContent=txt;
 return el;
}

function roleMenu(selected){
 const select=document.createElement("select");
 select.className="roleSelect";
 roles.forEach(role=>{
  const opt=document.createElement("option");
  opt.value=role;
  opt.textContent=role;
  select.appendChild(opt);
 });
 select.value=selected;
 return select;
}

function addPerson(){
 const name=$("name").value.trim();
 if(!name){alert("Введи прізвище або ім'я");return;}
 people.push({
  id:makeId(),
  name,
  role:$("role").value||roles[0],
  present:true
 });
 $("name").value="";
 save();
 render();
}

function update(id,fn){
 const p=people.find(x=>x.id===id);
 if(p){fn(p);save();render();}
}

function move(id,dir){
 const i=people.findIndex(p=>p.id===id);
 const j=i+dir;
 if(i<0||j<0||j>=people.length)return;
 [people[i],people[j]]=[people[j],people[i]];
 save();
 render();
}

function renderAttendance(){
 const present=people.filter(p=>p.present);
 const absent=people.filter(p=>!p.present);
 $("presentCount").textContent=present.length;
 $("absentCount").textContent=absent.length;

 const host=$("absentNames");
 host.replaceChildren();

 if(!absent.length){
  host.appendChild(element("div","absentName","Немає відсутніх"));
 }else{
  absent.forEach(p=>{
   host.appendChild(element("div","absentName",p.name));
  });
 }
}

function render(){
 const host=$("people");
 host.replaceChildren();
 const query=$("search").value.toLocaleLowerCase("uk");
 const present=people.filter(p=>p.present).length;

 $("count").textContent=
 `Є: ${present} • Немає: ${people.length-present} • Всього: ${people.length}`;

 const filtered=people.filter(p=>
  p.name.toLocaleLowerCase("uk").includes(query)
 );

 if(!filtered.length){
  host.appendChild(element(
   "p","muted",
   people.length?"Нічого не знайдено.":"Список порожній. Додай першу людину."
  ));
 }

 filtered.forEach(p=>{
  const i=people.indexOf(p);
  const card=element("div","person");

  card.appendChild(element("div","personName",`${i+1}. ${p.name}`));
  card.appendChild(element("div","muted",p.present?"🟢 Присутній":"🔴 Відсутній"));

  const buttons=element("div","personButtons");

  const toggle=element("button",p.present?"present":"absent",p.present?"✓ Є":"✕ Немає");
  toggle.onclick=()=>update(p.id,x=>x.present=!x.present);
  buttons.appendChild(toggle);

  const up=element("button","secondary","↑");
  up.disabled=i===0;
  up.onclick=()=>move(p.id,-1);
  buttons.appendChild(up);

  const down=element("button","secondary","↓");
  down.disabled=i===people.length-1;
  down.onclick=()=>move(p.id,1);
  buttons.appendChild(down);

  const edit=element("button","secondary","✎");
  edit.onclick=()=>{
   const value=prompt("Зміни прізвище або ім'я",p.name);
   if(value!==null&&value.trim())update(p.id,x=>x.name=value.trim());
  };
  buttons.appendChild(edit);

  const del=element("button","danger","🗑");
  del.onclick=()=>{
   if(confirm(`Видалити ${p.name}?`)){
    people=people.filter(x=>x.id!==p.id);
    save();
    render();
   }
  };
  buttons.appendChild(del);
  card.appendChild(buttons);

  const select=roleMenu(p.role);
  select.setAttribute("aria-label","Роль: "+p.name);
  select.onchange=()=>update(p.id,x=>x.role=select.value);
  card.appendChild(select);

  host.appendChild(card);
 });

 renderAttendance();
}

/* Кількість місць у списках:
   4 відділення: пріоритет залишку 1, 4, 2, 3.
   3 відділення: пріоритет залишку 1, 3, 2.
*/
function calculateSizes(total,cols){
 const base=Math.floor(total/cols);
 const remainder=total%cols;
 const sizes=Array(cols).fill(base);

 const priority=cols===4
  ?[0,3,1,2]
  :[0,2,1];

 for(let i=0;i<remainder;i++){
  sizes[priority[i]]++;
 }
 return sizes;
}

function build(){
 const cols=Number($("cols").value);
 const host=$("formation");
 const separate=$("separateRoles");

 host.replaceChildren();
 separate.replaceChildren();

 const active=people.filter(p=>
  p.present &&
  p.role!=="Командир взводу" &&
  p.role!=="Старшина"
 );

 // Окремі ролі
 ["Командир взводу","Старшина"].forEach(role=>{
  const block=element("div","line");
  block.appendChild(element("div","personName",role));

  const members=people.filter(p=>p.present&&p.role===role);

  if(members.length){
   members.forEach(p=>{
    block.appendChild(element("div","muted",p.name));
   });
  }else{
   block.appendChild(element("div","muted","Не призначено"));
  }

  separate.appendChild(block);
 });

 if(!active.length){
  $("status").textContent="Немає інших присутніх людей.";
  return;
 }

 // Визначаємо керівників відповідних списків.
 const leaders=Array(cols).fill(null);
 const leaderIds=new Set();

 for(let i=0;i<cols;i++){
  const role=`Командир ${i+1} відділення`;
  const found=active.filter(p=>p.role===role);

  if(found.length){
   leaders[i]=found[0];
   leaderIds.add(found[0].id);
  }
 }

 // Решта учасників без повторного додавання керівників.
 const regular=active.filter(p=>!leaderIds.has(p.id));

 // Розрахунок кількості людей у кожному списку.
 const sizes=calculateSizes(active.length,cols);

 // Створення списків.
 const groups=Array.from({length:cols},()=>[]);
 let cursor=0;

 for(let i=0;i<cols;i++){
  const size=sizes[i];
  const leader=leaders[i];

  // Керівник враховується в загальній кількості,
  // але відображається окремо в заголовку.
  const regularSlots=size-(leader?1:0);

  for(let j=0;j<regularSlots&&cursor<regular.length;j++){
   groups[i].push(regular[cursor++]);
  }
 }

 groups.forEach((group,index)=>{
  const block=element("div","groupCard");

  block.appendChild(element(
   "div","groupTitle",
   `${index+1} відділення`
  ));

  const leader=leaders[index];

  block.appendChild(element(
   "div","groupLeader",
   leader
    ?`Командир відділення: ${leader.name}`
    :"Командира не призначено"
  ));

  block.appendChild(element(
   "div","groupCount",
   `Кількість людей: ${sizes[index]}`
  ));

  if(group.length){
   group.forEach(p=>{
    block.appendChild(element(
     "div","groupPerson",
     p.name
    ));
   });
  }else if(!leader){
   block.appendChild(element(
    "div","groupPerson","—"
   ));
  }

  host.appendChild(block);
 });

 $("status").textContent=
 `Присутні у списках: ${active.length} • Відділень: ${cols} • Розподіл: ${sizes.join(" / ")}`;
}

load();

const initialRole=roleMenu(roles[0]);
initialRole.id="role";
$("role").replaceWith(initialRole);

$("add").onclick=addPerson;

$("name").addEventListener("keydown",e=>{
 if(e.key==="Enter")addPerson();
});

$("allYes").onclick=()=>{
 people.forEach(p=>p.present=true);
 save();
 render();
};

$("allNo").onclick=()=>{
 people.forEach(p=>p.present=false);
 save();
 render();
};

$("search").oninput=render;
$("build").onclick=build;

render();
</script>
</body>
</html>
